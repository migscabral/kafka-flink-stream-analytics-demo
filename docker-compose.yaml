version: "3.9"

services:
  # ------------------------------
  # Kafka (KRaft mode)
  # ------------------------------
  broker:
    image: confluentinc/cp-kafka:7.6.1
    container_name: broker
    networks:
      - flink-net
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@broker:29093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://broker:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: "w8b7yqJdTLe7H2C6P4oC0A"

  # ------------------------------
  # Flink JobManager
  # ------------------------------
  jobmanager:
    image: flink:1.18
    container_name: jobmanager
    networks:
      - flink-net
    depends_on:
      - broker
    ports:
      - "8081:8081"
      - "6123:6123"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        jobmanager.memory.process.size: 1600m
        taskmanager.memory.process.size: 1600m
        parallelism.default: 1
        execution.checkpointing.interval: 10s

  # ------------------------------
  # Flink TaskManager
  # ------------------------------
  taskmanager:
    image: flink:1.18
    container_name: taskmanager
    networks:
      - flink-net
    depends_on:
      - jobmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
        parallelism.default: 1

  # ------------------------------
  # Flink SQL Gateway
  # ------------------------------
  sql-gateway:
    image: flink:1.18
    container_name: sql-gateway
    networks:
      - flink-net
    ports:
      - "8083:8083"
    depends_on:
      - jobmanager
      - taskmanager
    volumes:
      - ./sql-gateway-defaults.yaml:/opt/flink/conf/sql-gateway-defaults.yaml
    command: bash -c "/opt/flink/bin/sql-gateway.sh start-foreground --gateway-conf /opt/flink/conf/sql-gateway-defaults.yaml"


  # ------------------------------
  # Zeppelin
  # ------------------------------
  zeppelin:
    image: apache/zeppelin:0.11.2
    container_name: zeppelin
    networks:
      - flink-net
    ports:
      - "8082:8080"
    depends_on:
      - sql-gateway
    volumes:
      - ./zeppelin/interpreter.json:/zeppelin/conf/interpreter.json

  # ------------------------------
  # Kafka UI (Provectus)
  # ------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    networks:
      - flink-net
    ports:
      - "8080:8080"
    depends_on:
      - broker
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: broker:9092

# ------------------------------
# Docker Network
# ------------------------------
networks:
  flink-net:
    driver: bridge
