version: "3.9"

services:
  # ------------------------------
  # Kafka (KRaft mode)
  # ------------------------------
  broker:
    image: apache/kafka:4.1.1
    container_name: broker
    profiles:
      - core
    networks:
      - flink-net
    ports:
      - "9092:9092"
      - "8778:8778" # expose Jolokia port
    volumes:
      - ./jolokia-jvm-agent-2.6.0.jar:/opt/jolokia/jolokia.jar:ro
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@broker:29093"
      # KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"

      # KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093"
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093"

      # KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://broker:9092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://broker:29092,EXTERNAL://localhost:9092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: "w8b7yqJdTLe7H2C6P4oC0A"
      PATH: "/opt/kafka/bin:$PATH"
      KAFKA_OPTS: "-javaagent:/opt/jolokia/jolokia.jar=port=8778,host=0.0.0.0"

  # ------------------------------
  # Flink JobManager
  # ------------------------------
  jobmanager:
    image: flink:1.17.2-scala_2.12
    container_name: jobmanager
    profiles:
      - core
    networks:
      - flink-net
    depends_on:
      - broker
    ports:
      - "8081:8081"
      - "6123:6123"
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        jobmanager.memory.process.size: 1600m
        parallelism.default: 1
        execution.checkpointing.interval: 10s
        rest.address: jobmanager
        rest.port: 8081
      FLINK_LOG_LEVEL: DEBUG
    # AWS credentials, region and S3_BUCKET come straight from .env, so shell exports cannot override them.
    env_file:
      - .env
    volumes:
      - ./jars/flink-sql-connector-kafka-1.17.2.jar:/opt/flink/lib/flink-sql-connector-kafka-1.17.2.jar
      - ./jars/iceberg-flink-runtime-1.17-1.6.1.jar:/opt/flink/lib/iceberg-flink-runtime-1.17-1.6.1.jar
      - ./jars/iceberg-aws-bundle-1.6.1.jar:/opt/flink/lib/iceberg-aws-bundle-1.6.1.jar
      - ./jars/flink-shaded-hadoop-2-uber-2.8.3-10.0.jar:/opt/flink/lib/flink-shaded-hadoop-2-uber-2.8.3-10.0.jar

  # ------------------------------
  # Flink TaskManager
  # ------------------------------
  taskmanager:
    image: flink:1.17.2-scala_2.12
    # container_name: taskmanager
    profiles:
      - core
    networks:
      - flink-net
    depends_on:
      - jobmanager
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.host: taskmanager
        taskmanager.memory.process.size: 1600m
        taskmanager.numberOfTaskSlots: 8
        parallelism.default: 1
      FLINK_LOG_LEVEL: DEBUG
    env_file:
      - .env
    volumes:
      - ./jars/flink-sql-connector-kafka-1.17.2.jar:/opt/flink/lib/flink-sql-connector-kafka-1.17.2.jar
      - ./jars/iceberg-flink-runtime-1.17-1.6.1.jar:/opt/flink/lib/iceberg-flink-runtime-1.17-1.6.1.jar
      - ./jars/iceberg-aws-bundle-1.6.1.jar:/opt/flink/lib/iceberg-aws-bundle-1.6.1.jar
      - ./jars/flink-shaded-hadoop-2-uber-2.8.3-10.0.jar:/opt/flink/lib/flink-shaded-hadoop-2-uber-2.8.3-10.0.jar

  # ------------------------------
  # Zeppelin
  # ------------------------------
  zeppelin:
    image: zeppelin-flink:0.11.2-1.17.2
    platform: linux/amd64 # apache/zeppelin has no arm64 build; runs under emulation on Apple Silicon
    container_name: zeppelin
    profiles:
      - core
    networks:
      - flink-net
    ports:
      - "8082:8080"
    depends_on:
      - jobmanager
    entrypoint: >
      bash -c "
        # FIX: Grant execute permission to the mounted script
        chmod +x /tmp/setup_flink_interpreter.sh

        # 1. Start Zeppelin in background
        /opt/zeppelin/bin/zeppelin.sh &
        ZEPPELIN_PID=$!
        
        # 2. Wait for Zeppelin to be fully loaded (listening on its port)
        echo 'Waiting for Zeppelin UI (8080) to become available...'
        
        # Use built-in Bash /dev/tcp for connectivity check
        while ! timeout 1 bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/8080'; do
          sleep 1 
        done
        echo 'Zeppelin is up. Running configuration script...'        
        # 3. Configure Flink Interpreter
        /tmp/setup_flink_interpreter.sh
        
        # 4. Wait for the main Zeppelin process to finish
        wait $ZEPPELIN_PID
      "
    volumes:
      - ./zeppelin/setup_flink_interpreter.sh:/tmp/setup_flink_interpreter.sh
      - ./jars/flink-sql-connector-kafka-1.17.2.jar:/opt/flink/lib/flink-sql-connector-kafka-1.17.2.jar
      - ./jars/iceberg-flink-runtime-1.17-1.6.1.jar:/opt/flink/lib/iceberg-flink-runtime-1.17-1.6.1.jar
      - ./jars/iceberg-aws-bundle-1.6.1.jar:/opt/flink/lib/iceberg-aws-bundle-1.6.1.jar
      - ./jars/flink-shaded-hadoop-2-uber-2.8.3-10.0.jar:/opt/flink/lib/flink-shaded-hadoop-2-uber-2.8.3-10.0.jar

    environment:
      FLINK_HOME: /opt/flink    
    env_file:
      - .env

  # ------------------------------
  # Kafka UI (Provectus)
  # ------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    profiles:
      - core
    networks:
      - flink-net
    ports:
      - "8080:8080"
    depends_on:
      - broker
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: broker:29092

  # ------------------------------
  # Data Generator
  # ------------------------------
  clickstream-generator:
    image: clickstream-generator:latest
    container_name: clickstream-generator
    profiles:
      - datagen
    networks:
      - flink-net
    environment:
      KAFKA_BROKER: "broker:29092"
      KAFKA_TOPIC: "clickstream"
      CLIENT_ID: "clickstream-generator-1"
      USER_POOL_SIZE: 10
      PRODUCT_POOL_SIZE: 20


# ------------------------------
# Docker Network
# ------------------------------
networks:
  flink-net:
    driver: bridge
